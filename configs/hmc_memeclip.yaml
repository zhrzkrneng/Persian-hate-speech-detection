# MemeCLIP (Shah et al., EMNLP 2024) as a second baseline on HMC.
#
# Values follow the authors' released configs.py: map_dim 1024, one mapping
# layer, one pre-output layer, adapter ratio 0.2 with reduction 4, cosine
# scale 30, lr 1e-4, weight decay 1e-4.
#
# Two deliberate departures, both so the comparison against hateclipper is
# fair rather than faithful to the reference run:
#   - batch size 64 and 20 epochs, matching configs/hmc_align.yaml, not the
#     reference's 16 and 10. Comparing two architectures under different
#     training budgets would not say which architecture is better.
#   - dropout is a single value here; the reference uses three (0.1 for the
#     projections, 0.4 and 0.2 inside the head). Worth revisiting if MemeCLIP
#     underperforms its paper.

encoder:
  name: openai/clip-vit-large-patch14
  max_text_length: 77
  batch_size: 64

model:
  architecture: memeclip
  projection_dim: 1024
  pre_output_dim: 1024
  num_pre_output_layers: 1
  dropout: 0.1
  num_classes: 2
  adapter_ratio: 0.2
  adapter_reduction: 4
  cosine_scale: 30.0
  normalise_before_fusion: true

train:
  epochs: 20
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip: 0.1
  seed: 0
  device: auto

data:
  name: hmc
  root: data/hmc
  feature_root: features
  train_split: train
  val_split: dev_seen
  test_split: test_seen

output_dir: runs
